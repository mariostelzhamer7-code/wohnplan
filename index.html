<body>
<div id="app">
 <header class="topbar">
  <button id="brand" class="brand" title="Projekte öffnen"><img src="./icon-192.png" alt="WohnPlan" /><span class="brand-name">WohnPlan<small>Created by MS · Web 1.3.1</small></span></button>
  <button class="project-title" id="project-title" title="Projektübersicht öffnen">Mein Grundriss ▾</button>
  <span class="save-status" id="save-status" aria-live="polite">● Bereit</span>
  <div class="top-actions">
   <button id="undo-btn" title="Rückgängig" aria-label="Rückgängig">↶</button><button id="redo-btn" title="Wiederholen" aria-label="Wiederholen">↷</button>
   <button id="check-project" class="outline" title="Projektprüfung">✓ Prüfen</button><button id="export-btn" class="outline">Export</button><button id="settings-btn" class="settings-action" title="Einstellungen" aria-label="Einstellungen">⚙ <span>Einstellungen</span></button><button id="projects-btn" class="primary">Projekte</button>
  </div>
 </header>
 <div class="body-layout">
  <aside id="sidebar" class="sidebar" data-active-mode="planen">
   <div class="sidebar-title">Werkzeuge <button id="sidebar-close" class="icon-btn" title="Menü schließen">✕</button></div>
   <div class="mode-row"><button data-mode="planen" class="mode active">📐 Planen</button><button data-mode="einrichten" class="mode">🛋 Einrichten</button></div>
   <div class="side-section plan-only">
    <div class="label">Räume & Wände</div>
    <button id="add-room" class="side-action">▢ <span>Raum hinzufügen</span></button>
    <button id="add-door" class="side-action">🚪 <span>Tür einfügen</span></button>
    <button id="add-window" class="side-action">▭ <span>Fenster einfügen</span></button>
   </div>
   <div class="side-section furnish-only">
    <div class="label">Einrichtung</div>
    <button id="add-furniture" class="side-action highlight">⊞ <span>Möbelkatalog öffnen</span></button>
    <button id="add-group" class="side-action">❖ <span>Möbelgruppe einfügen</span></button>
     <button id="layers-btn" class="side-action">▤ <span>Ebenen verwalten</span></button>
   </div>
   <div class="side-section">
    <div class="label">Anzeige</div>
     <button id="check-sidebar" class="side-action">✓ <span>Projekt prüfen</span></button>
    <label class="toggle"><input type="checkbox" id="grid-toggle" checked /> Raster anzeigen</label>
    <label class="toggle"><input type="checkbox" id="snap-toggle" checked /> Magnetisches Raster</label>
    <label class="toggle"><input type="checkbox" id="measure-toggle" checked /> Bemaßung anzeigen</label>
   </div>
   <div class="side-section note"><b>Hinweis</b><p>Objekt antippen und ziehen. Mit den blauen Griffen Möbel vergrößern. Türen und Fenster lassen sich nur entlang ihrer Wand verschieben.</p></div>
  </aside>
  <main class="workspace" id="workspace">
   <div class="workspace-top">
    <button id="menu-toggle" title="Werkzeugmenü">☰ <span>Werkzeuge</span></button>
    <span id="mode-label" class="workspace-mode">📐 Planen</span>
    <span id="scene-info" class="scene-info">Kein Raum</span>
    <button id="help-btn" title="Einführung anzeigen">?</button>
   </div>
   <div class="canvas-wrap" id="canvas-wrap">
    <svg id="plan-svg" aria-label="2D-Grundriss" role="img" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="zoom-controls"><button id="zoom-in" title="Vergrößern">+</button><button id="zoom-out" title="Verkleinern">−</button><button id="zoom-fit" title="Grundriss zentrieren">⌗</button></div>
    <div class="scale-label" id="scale-label"></div>
   </div>
   <div class="context-bar" id="context-bar"><span>Tippe auf einen Raum, ein Möbel, eine Tür oder ein Fenster.</span></div>
   <nav class="mobile-nav"><button id="m-projects">▦<small>Projekte</small></button><button id="m-rooms">▢<small>Räume</small></button><button id="m-furniture">♧<small>Möbel</small></button><button id="m-export">⇩<small>Export</small></button></nav>
  </main>
 </div>
</div>

async function exportPDF() {

  }

window.addEventListener('keydown',e=>{
 if(root.firstChild || ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redoAction():undoAction();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redoAction();return}
 const s=selected();if(!s)return;
 if(['Delete','Backspace'].includes(e.key)){e.preventDefault();contextAction('delete');return}
 const deltas={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(!deltas[e.key])return;
 if(s.kind==='furniture'&&!s.value.gesperrt&&!s.room.gesperrt){e.preventDefault();commit();s.value.x+=deltas[e.key][0]*(e.shiftKey?10:1);s.value.y+=deltas[e.key][1]*(e.shiftKey?10:1);changed()}
});
window.addEventListener('beforeunload',persist);window.addEventListener('pagehide',persist);
window.addEventListener('resize',renderScene);window.addEventListener('orientationchange',()=>setTimeout(renderScene,150));
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();setTimeout(fitScene,70);if(ui.guide)setTimeout(showHelp,450);if(storageBlocked)setTimeout(()=>toast('Lokaler Speicher ist nicht verfügbar – bitte Backup exportieren.'),1400);
})();

</script>
</body>
